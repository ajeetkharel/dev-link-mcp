name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv leaves its cache off for tag pushes, so a release never builds from a restored cache.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Check the tag matches project.version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match project.version $version"; exit 1
          fi
      - name: Extract the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The lines between "## [<version>]" and the next "## [" heading or link reference.
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1
          fi
          cat release-notes.md
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/dev-link-mcp
    permissions:
      # Trusted publishing: PyPI accepts the upload against this workflow's OIDC token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md --verify-tag
