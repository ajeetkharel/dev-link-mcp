name: Feature request
description: Suggest a new tool, setting or change.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task or workflow, and where dev-link gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The tool, setting or behaviour you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or other ways to solve it, such as a plugin (docs/extending.md).
